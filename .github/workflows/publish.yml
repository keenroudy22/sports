name: Refresh and publish KeenRoudy Sports
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '07 11 * * *'
      timezone: America/New_York
    - cron: '37 6,12,18 * * *'
      timezone: America/New_York
    - cron: '17 17,20 * * *'
      timezone: America/New_York
    - cron: '47 23 * * *'
      timezone: America/New_York
    - cron: '17 2 * * *'
      timezone: America/New_York
    - cron: '17 5 * * *'
      timezone: America/New_York
    # Saturdays and Sundays, hourly through the games, so scores and finals do not sit stale
    - cron: '23 13-23 * * 0,6'
      timezone: America/New_York
    # Weekend mornings, so the plays feed opens its 9:00 window before the noon kickoffs
    - cron: '7 9,10 * * 0,6'
      timezone: America/New_York
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: football-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check publication rules
        run: python -m unittest discover -s tests
      - name: Verify no published record was rewritten
        run: python -m unittest tests.test_integrity -v
      - name: Check browser scripts
        run: |
          node --check site/core.js
          node --check site/app.js
          node --test tests/*.test.js
      - name: Refresh schedules and record original forecasts
        run: python scripts/refresh.py
      - name: Refresh NBA and MLB scoreboards
        run: python scripts/sports_refresh.py
      - name: Store box scores, play-by-play and closing lines for new finals
        run: python scripts/boxscores.py
      - name: Check whether player history needs rebuilding
        id: history
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os, subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines() if os.environ['EVENT_NAME'] == 'push' else []
          needed = any(p.startswith('research/') or p in ('scripts/player_history.py', 'scripts/opponent_history.py', 'site/data/research.json') for p in changed)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('needed=' + str(needed).lower() + '\n')
          PY
      - name: Refresh verified player and position history
        if: (github.event_name == 'push' && steps.history.outputs.needed == 'true') || github.event_name == 'workflow_dispatch' || github.event.schedule == '07 11 * * *'
        run: python scripts/player_history.py
      - name: Refresh followed player identities and team colors
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '07 11 * * *'
        run: python scripts/player_identity.py
      - name: Refresh followed opponent matchup history
        if: (github.event_name == 'push' && steps.history.outputs.needed == 'true') || github.event_name == 'workflow_dispatch' || github.event.schedule == '07 11 * * *'
        run: python scripts/opponent_history.py
      - name: Refresh injury context
        run: python scripts/research_context.py
      - name: Refresh NFL snap counts and game context from nflverse
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '07 11 * * *'
        run: python scripts/nflverse.py
      - name: Publish model v2 forecasts and player projections
        run: python scripts/forecast.py
      - name: Late snapshot for games inside the hour whose inactives changed (priced from, not graded)
        run: python scripts/forecast.py --late
      - name: Venue table (roof and a point) for any venue the store or slate names that the table lacks
        run: python scripts/venues.py
      - name: Kickoff forecasts for upcoming outdoor games (National Weather Service)
        run: python scripts/weather.py
      - name: Capture DraftKings NFL prop lines from ESPN
        run: python scripts/prop_lines.py
      - name: Capture spreads and totals across books (The Odds API, budgeted)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/odds_api.py
      - name: Price player props for the games nearest kickoff (budgeted)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/prop_odds.py
      - name: Price DraftKings and FanDuel props for the whole slate (SharpAPI, rate limited)
        env:
          SHARP_API: ${{ secrets.SHARP_API }}
        run: python scripts/sharp_odds.py
      - name: Grade forecasts and picks against the close
        run: python scripts/scoreboard.py
      - name: Compile sourced line catalog
        run: python scripts/market_lines.py
      - name: Build the page payloads (site/data/app, not committed)
        run: python scripts/build_site.py
      - name: Build the plays feed and its cards (site/data/feed.xml and cards, not committed)
        run: python scripts/feed.py
      - name: Preserve the public record
        run: |
          python scripts/integrity.py
          git config user.name 'football-forecast[bot]'
          git config user.email 'football-forecast[bot]@users.noreply.github.com'
          git add site/data tests/integrity-ledger.json data/boxscores data/nflverse data/forecasts data/props data/odds data/prop-odds data/model data/venues.json data/venues-review.json data/weather
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh schedules, finals and pregame forecasts'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
